services:
  - type: web
    name: gbu-inventory-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ORIGINS
        sync: false
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"
